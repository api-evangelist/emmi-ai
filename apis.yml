name: Emmi Ai
description: >-
  Emmi AI is an Austrian engineering-AI company building Large Engineering Models
  (LEMs) - pre-trained, physics-accurate neural networks that replace traditional
  CAE/CFD solvers to deliver real-time, GPU-accelerated simulation and design
  validation for manufacturing, aerospace, semiconductor, and energy engineering.
  Its flagship open-source Noether framework (the emmiai-noether PyTorch package)
  provides transformer building blocks, a model/dataset/recipe zoo, and a
  command-line toolchain for training, fine-tuning, and deploying industrial
  physics models, alongside vertical products such as NeuralWing (aircraft wing
  validation), NeuralMould (injection moulding), and NeuralDEM (particulate flows).
  Emmi AI was acquired by Mistral AI in May 2026 to build an industrial AI stack.
